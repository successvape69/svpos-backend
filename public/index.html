<style>

  body { background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .card { background: #141414; border: 1px solid rgba(255,255,255,0.05); }
  .card.bg-dark-800 { background: #1F1F1F; }
  .glass { background: rgba(20,20,20,0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  .tabular { font-variant-numeric: tabular-nums; }

<body class="font-body text-white selection:bg-accent/30 overflow-hidden">

<div id="app" class="h-screen flex overflow-hidden">
  <!-- Sidebar -->

    <div class="flex-1 flex flex-col gap-4">
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="dashboard" title="Dashboard">📊</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="kasir" title="Kasir">🛒</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="products" title="Produk">📦</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="orders" title="Order">📜</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="customers" title="Customer">👥</button>
    </div>
    <button id="btnLogout" class="w-12 h-12 flex items-center justify-center text-white/20 hover:text-danger transition-colors">🚪</button>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 bg-dark-900">
    <!-- Login Screen -->
    <div id="loginScreen" class="h-full flex items-center justify-center p-4">
      <div class="card rounded-3xl p-8 w-full max-w-sm shadow-2xl border-white/10">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-accent rounded-2xl mx-auto mb-4 flex items-center justify-center text-2xl">⚡</div>
          <div class="font-head font-extrabold text-2xl tracking-tight mb-1">Success Vape</div>
          <div class="text-sm text-white/40">Premium POS Experience</div>
        </div>
        <form id="loginForm" class="space-y-4">
          <div>
            <input id="loginUsername" type="text" placeholder="Username" class="w-full bg-dark-800 border border-white/5 rounded-xl px-4 py-3.5 text-sm focus:border-accent outline-none transition-all" value="admin">
          </div>
          <div>
            <input id="loginPassword" type="password" placeholder="Password" class="w-full bg-dark-800 border border-white/5 rounded-xl px-4 py-3.5 text-sm focus:border-accent outline-none transition-all" value="admin123">
          </div>
          <button type="submit" class="w-full bg-accent text-black font-bold rounded-xl py-3.5 text-sm shadow-lg shadow-accent/20 active:scale-[0.98] transition-transform">Sign In</button>
        </form>
        <div id="loginError" class="text-xs text-danger mt-4 text-center hidden font-medium"></div>
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div id="mainApp" class="hidden flex flex-col h-full overflow-hidden">
      <header class="h-16 px-6 flex items-center justify-between border-b border-white/5 bg-dark-900/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
          <span id="viewTitle" class="font-head font-bold text-lg tracking-tight">Dashboard</span>
          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
        </div>
        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <div id="currentUser" class="font-bold text-sm">Admin</div>
            <div class="text-[10px] text-white/40 tracking-widest uppercase">Verified</div>
          </div>
          <div class="w-10 h-10 rounded-full bg-dark-800 border border-white/10 flex items-center justify-center text-xs">A</div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
        <section id="view-dashboard" class="hidden"></section>
        <section id="view-kasir" class="hidden h-full"></section>
        <section id="view-products" class="hidden"></section>
        <section id="view-orders" class="hidden"></section>

      </main>
    </div>

</div>

<div id="modalRoot"></div>
<div id="receiptPrintArea" class="hidden font-body text-black"></div>

<script>
const API_BASE = '/api';

const IDR = n => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(Math.round(n||0));
const fmtDate = ts => new Date(ts).toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'});
const uid = () => Math.random().toString(36).slice(2,10);

function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-2 rounded-full text-sm font-medium shadow-lg ' +
    (kind==='error' ? 'bg-danger text-white' : 'bg-ink text-white');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 1800);
}

function modal(innerHtml, {wide=false} = {}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" id="modalOverlay">
      <div class="card bg-dark-900 border border-white/10 w-full ${wide ? 'sm:max-w-xl':'sm:max-w-md'} rounded-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
        ${innerHtml}
      </div>
    </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

let currentUser = null;
let authToken = null;
let customers = [];
let orders = [];
let selectedCustomer = null;
let cart = {};
let activeTab = 'dashboard';

let products = {};

// --- Auth helpers ---
function getToken(){ return localStorage.getItem('authToken'); }
function setToken(t){ localStorage.setItem('authToken', t); }
function clearToken(){ localStorage.removeItem('authToken'); localStorage.removeItem('currentUser'); }

// --- API call with JWT ---
async function apiCall(endpoint, options = {}){
  const token = authToken || getToken();
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;

  try {
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (res.status === 401) {
      clearToken(); currentUser = null; authToken = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('hidden');
      toast('Sesi expired, login ulang','error');
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return await res.json();
  } catch(e){
    console.error('API error:', e);
    toast(e.message || 'Koneksi API gagal','error');
    throw e;
  }
}

async function loadCustomers(){
  try { customers = await apiCall('/customers'); } catch(e){ customers = []; }
}
async function loadOrders(){
  try { orders = await apiCall('/orders'); } catch(e){ orders = []; }
}
async function loadProducts(){
  try {
    const data = await apiCall('/products');
    products = {};
    data.forEach(p => { products[p._id] = { id: p._id, name: p.name, price: p.price, stock: p.stock }; });
  } catch(e){ /* fallback empty */ }
}

// --- Login ---
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');

    authToken = data.token;
    currentUser = data.user;
    setToken(data.token);
    localStorage.setItem('currentUser', JSON.stringify(data.user));

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    await loadCustomers();
    await loadOrders();
    await loadProducts();
    render();
    toast('Login berhasil');
  } catch(err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
};

// --- Logout ---
document.getElementById('btnLogout').onclick = () => {
  currentUser = null; authToken = null;
  clearToken();
  location.reload();
};

// --- Tabs ---
document.querySelectorAll('.tabbtn').forEach(b => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(x => {
      x.classList.remove('text-accent','border-accent');
      x.classList.add('text-white/50','border-transparent');
    });
    b.classList.add('text-accent','border-accent');
    b.classList.remove('text-white/50','border-transparent');
    render();
  };
});

function render(){
  if (!currentUser) return;
  document.getElementById('currentUser').textContent = currentUser.username;
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('sidebar').classList.add('flex');
  
  // Update view title & active nav
  document.getElementById('viewTitle').textContent = activeTab.charAt(0).toUpperCase() + activeTab.slice(1);
  document.querySelectorAll('.tabbtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === activeTab);
  });
  
  if (activeTab !== 'kasir'){ const old=document.getElementById('cartBar'); if(old) old.remove(); }
  document.querySelectorAll('main section').forEach(s=> s.classList.add('hidden'));
  
  const views = {
    dashboard: 'view-dashboard', kasir: 'view-kasir', products: 'view-products',
    orders: 'view-orders', customers: 'view-customers'
  };
  document.getElementById(views[activeTab]).classList.remove('hidden');
  
  if (activeTab === 'dashboard') renderDashboard();
  else if (activeTab === 'kasir') renderKasir();
  else if (activeTab === 'products') renderProducts();
  else if (activeTab === 'orders') renderOrders();
  else if (activeTab === 'customers') renderCustomers();
}

// ===================== DASHBOARD =====================
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const paidOrders = orders.filter(o => o.paymentStatus==='paid');
  const todayOrders = paidOrders.filter(o => isToday(o.createdAt));
  const pendingOrders = orders.filter(o => o.paymentStatus==='pending' && o.orderStatus!=='cancelled');
  const todayOmzet = todayOrders.reduce((s,o)=>s+(o.totalAmount||0),0);
  const allOmzet = paidOrders.reduce((s,o)=>s+(o.totalAmount||0),0);
  const totalStok = Object.values(products).reduce((s,p)=>s+(p.stock||0),0);
  const totalSku = Object.values(products).length;

  const qtyByProd = {};
  paidOrders.forEach(o => (o.items||[]).forEach(it => { qtyByProd[it.productName] = (qtyByProd[it.productName]||0) + (it.quantity||0); }));
  const topProducts = Object.entries(qtyByProd).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lowStock = Object.values(products).filter(p => (p.stock||0) <= 5).sort((a,b)=>a.stock-b.stock);

  const days = [];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const next=new Date(d); next.setDate(d.getDate()+1);
    const dayOmzet = paidOrders.filter(o=>{ const t=new Date(o.createdAt); return t>=d && t<next; }).reduce((s,o)=>s+(o.totalAmount||0),0);
    days.push({label:d.toLocaleDateString('id-ID',{weekday:'short'}), val:dayOmzet});
  }
  const maxDayVal = Math.max(1, ...days.map(d=>d.val));

  el.innerHTML = `
    <!-- Top Hero Metric Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>OMZET HARI INI</span>
          <span class="text-accent text-sm">📈</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${IDR(todayOmzet)}</div>
        <div class="text-xs text-accent/80 font-medium">${todayOrders.length} transaksi selesai</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>TOTAL PENDAPATAN</span>
          <span class="text-accent text-sm">💎</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${IDR(allOmzet)}</div>
        <div class="text-xs text-white/40 font-medium">${paidOrders.length} total pesanan</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>PERLU DIKONFIRMASI</span>
          <span class="text-warn text-sm">⏳</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-warn mb-1 tabular">${pendingOrders.length}</div>
        <div class="text-xs text-white/40 font-medium">Menunggu pembayaran/transfer</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>TOTAL STOK FISIK</span>
          <span class="text-white/40 text-sm">📦</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${totalStok}</div>
        <div class="text-xs text-white/40 font-medium">${totalSku} varian produk terdaftar</div>
      </div>
    </div>

    <!-- Revenue Graph -->
    <div class="card rounded-2xl p-5 border-white/5 mb-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-sm font-bold">Tren Penjualan</div>
          <div class="text-xs text-white/40">Grafik 7 hari terakhir</div>
        </div>
      </div>
      <div class="flex items-end gap-3 h-36 pt-4 border-t border-white/5">
        ${days.map(d=>`
          <div class="flex-1 flex flex-col items-center gap-2 group">
            <div class="w-full bg-dark-800 group-hover:bg-accent/20 rounded-xl h-full flex items-end p-1 transition-colors">
              <div class="w-full bg-accent rounded-lg transition-all duration-500 shadow-lg shadow-accent/20" style="height:${Math.round((d.val/maxDayVal)*100)}%" title="${IDR(d.val)}"></div>
            </div>
            <span class="text-[11px] text-white/40 font-medium">${d.label}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Split Panels: Best Sellers & Low Stock -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card rounded-2xl p-5 border-white/5">
        <div class="text-sm font-bold mb-4">Produk Paling Laris</div>
        <div class="space-y-3">
          ${topProducts.length ? topProducts.map(([name,qty],i)=>`
            <div class="flex items-center justify-between p-3 bg-dark-800 rounded-xl border border-white/5">
              <div class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-accent/10 text-accent font-bold text-xs flex items-center justify-center">${i+1}</span>
                <span class="text-sm font-medium">${name}</span>
              </div>
              <span class="text-xs font-bold text-accent tabular">${qty} Terjual</span>
            </div>
          `).join('') : `<div class="text-sm text-white/30 py-8 text-center">Belum ada transaksi.</div>`}
        </div>
      </div>

      <div class="card rounded-2xl p-5 border-white/5">
        <div class="text-sm font-bold mb-4">Peringatan Stok Tipis (≤ 5)</div>
        <div class="space-y-3">
          ${lowStock.length ? lowStock.map(p=>`
            <div class="flex items-center justify-between p-3 bg-dark-800 rounded-xl border border-white/5">
              <span class="text-sm font-medium">${p.name}</span>
              <span class="text-xs px-2.5 py-1 rounded-lg ${p.stock<=0?'bg-danger/20 text-danger':'bg-warn/20 text-warn'} font-bold tabular">Sisa ${p.stock}</span>
            </div>
          `).join('') : `<div class="text-sm text-accent py-8 text-center font-medium">✓ Semua stok tercukupi dengan baik</div>`}
        </div>
      </div>
    </div>
  `;
}

// ===================== KASIR =====================
function renderKasir(){
  const el = document.getElementById('view-kasir');
  const items = Object.values(products);
  const cartItems = Object.entries(cart).filter(([id,qty])=>qty>0);
  const total = cartItems.reduce((s,[id,qty])=> s + (products[id]?.price||0)*qty, 0);

  // Remove old floating cart if any
  const old = document.getElementById('cartBar'); if (old) old.remove();

  el.innerHTML = `
    <div class="h-full flex flex-col lg:flex-row gap-6">
      <!-- Left: Products Grid -->
      <div class="flex-1 flex flex-col min-h-0">
        <div class="mb-4 flex gap-3">
          <input id="kasirSearch" type="text" placeholder="Cari nama produk…" class="flex-1 bg-dark-800 border border-white/5 rounded-xl px-4 py-3 text-sm focus:border-accent outline-none">
          <button id="btnSelectCustomer" class="bg-dark-800 border border-white/5 hover:border-accent text-sm font-medium rounded-xl px-4 py-3 transition-colors">👤 ${selectedCustomer ? customers.find(c=>c._id===selectedCustomer)?.name : 'Tamu'}</button>
        </div>
        <div id="kasirGrid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 content-start pr-2"></div>
      </div>

      <!-- Right: Permanent Cart Panel -->
      <div class="w-full lg:w-96 card rounded-2xl flex flex-col h-auto lg:h-full border border-white/5 p-4 shadow-2xl">
        <div class="text-sm font-bold pb-3 border-b border-white/5 flex items-center justify-between">
          <span>Current Order</span>
          <span class="text-xs text-white/40">${cartItems.reduce((s,[,q])=>s+q,0)} items</span>
        </div>
        
        <div class="flex-1 overflow-y-auto my-3 space-y-2 pr-1">
          ${cartItems.length ? cartItems.map(([id,qty])=>{
            const p = products[id];
            return `<div class="bg-dark-800 rounded-xl p-3 border border-white/5 flex items-center justify-between text-sm">
              <div class="flex-1 truncate mr-2">
                <div class="font-medium truncate">${p.name}</div>
                <div class="text-xs text-white/40 tabular">${IDR(p.price)}</div>
              </div>
              <div class="flex items-center gap-2">
                <button data-dec="${id}" class="w-7 h-7 rounded-lg bg-dark-700 hover:bg-white/10 flex items-center justify-center text-xs">–</button>
                <span class="w-5 text-center tabular font-bold">${qty}</span>
                <button data-inc="${id}" class="w-7 h-7 rounded-lg bg-dark-700 hover:bg-white/10 flex items-center justify-center text-xs">+</button>
              </div>
            </div>`;
          }).join('') : `<div class="text-sm text-white/30 text-center py-20">Keranjang kosong</div>`}
        </div>

        <div class="pt-3 border-t border-white/5 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-sm text-white/50">Total</span>
            <span class="font-head font-extrabold text-xl tabular text-accent">${IDR(total)}</span>
          </div>
          <button id="btnCheckout" class="w-full bg-accent text-black font-bold rounded-xl py-3.5 text-sm shadow-lg shadow-accent/20 disabled:opacity-40 transition-all" ${cartItems.length?'':'disabled'}>Process Payment</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnSelectCustomer').onclick = openSelectCustomerModal;

  function drawGrid(filter=''){
    const grid = document.getElementById('kasirGrid');
    const f = filter.trim().toLowerCase();
    const list = items.filter(p=> !f || p.name.toLowerCase().includes(f));
    grid.innerHTML = list.map(p=>`
      <button data-add="${p.id}" class="prodcard card rounded-xl p-4 text-left flex flex-col justify-between ${((p.stock||0)<=0)?'opacity-30 pointer-events-none':''}">
        <div>
          <div class="text-sm font-semibold leading-snug line-clamp-2">${p.name}</div>
          <div class="text-[11px] text-white/40 mt-1">Stok ${p.stock||0}</div>
        </div>
        <div class="font-head font-bold text-accent tabular mt-4">${IDR(p.price)}</div>
      </button>`).join('') || `<div class="col-span-full text-center text-sm text-white/30 py-10">Produk tidak ditemukan.</div>`;
    
    grid.querySelectorAll('[data-add]').forEach(b=> b.onclick = ()=>{
      const id = b.dataset.add;
      const p = products[id];
      if ((p.stock||0) <= (cart[id]||0)) { toast('Stok tidak cukup','error'); return; }
      cart[id] = (cart[id]||0)+1;
      renderKasir();
    });
  }
  drawGrid();
  document.getElementById('kasirSearch').oninput = (e)=> drawGrid(e.target.value);

  el.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.inc; const p=products[id];
    if ((p.stock||0) <= (cart[id]||0)) { toast('Stok tidak cukup','error'); return; }
    cart[id]=(cart[id]||0)+1; renderKasir();
  });
  el.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.dec; cart[id]=Math.max(0,(cart[id]||0)-1); renderKasir();
  });
  document.getElementById('btnCheckout').onclick = openPaymentModal;
}

// ===================== PAYMENT METHOD MODAL =====================
function openPaymentModal(){
  const cartItems = Object.entries(cart).filter(([id,qty])=>qty>0);
  if (!cartItems.length) return;
  const total = cartItems.reduce((s,[id,qty])=> s + (products[id]?.price||0)*qty, 0);

  modal(`
    <div class="p-5">
      <div class="font-head font-bold text-lg mb-1">Pilih Pembayaran</div>
      <div class="text-sm text-white/50 mb-5 tabular font-bold">${IDR(total)}</div>
      <div class="space-y-2">
        <button id="payCash" class="w-full text-left card rounded-xl p-4 border border-black/5 hover:border-accent flex items-center gap-3">
          <span class="text-2xl">💵</span>
          <div>
            <div class="text-sm font-semibold">Tunai</div>
            <div class="text-xs text-white/40">Bayar langsung, order langsung selesai</div>
          </div>
        </button>
        <button id="payTransfer" class="w-full text-left card rounded-xl p-4 border border-black/5 hover:border-accent flex items-center gap-3">
          <span class="text-2xl">🏦</span>
          <div>
            <div class="text-sm font-semibold">Transfer / QRIS</div>
            <div class="text-xs text-white/40">Tunggu konfirmasi staff setelah transfer</div>
          </div>
        </button>
      </div>
      <button id="btnCancelPay" class="w-full mt-4 text-sm text-white/50 py-2">Batal</button>
    </div>
  `);
  document.getElementById('btnCancelPay').onclick = closeModal;
  document.getElementById('payCash').onclick = () => doCheckout('cash');
  document.getElementById('payTransfer').onclick = () => doCheckout('transfer');
}

// ===================== CHECKOUT =====================
async function doCheckout(paymentMethod){
  const cartItems = Object.entries(cart).filter(([id,qty])=>qty>0);
  if (!cartItems.length) return;

  const items = cartItems.map(([id,qty])=>{
    const p = products[id];
    return { productId:id, productName:p.name, price:p.price, quantity:qty, subtotal:p.price*qty };
  });
  const total = items.reduce((s,it)=>s+it.subtotal,0);

  const orderData = {
    customerId: selectedCustomer,
    items,
    totalAmount: total,
    source: 'pos'
  };

  try {
    const result = await apiCall('/orders', { method: 'POST', body: JSON.stringify(orderData) });
    const order = result.order;

    // Kalau bayar tunai, langsung set paid + completed
    if (paymentMethod === 'cash') {
      await apiCall(`/orders/${order.orderId}`, {
        method: 'PATCH',
        body: JSON.stringify({ paymentStatus: 'paid', orderStatus: 'completed' })
      });
      order.paymentStatus = 'paid';
      order.orderStatus = 'completed';
    }

    toast(paymentMethod === 'cash' ? 'Pembayaran tunai berhasil' : 'Order dibuat, tunggu transfer');
    cart = {};
    selectedCustomer = null;
    await loadOrders();
    await loadProducts();
    closeModal();
    showReceipt(order, paymentMethod);
    render();
  } catch(e){
    toast('Gagal membuat order','error');
  }
}

// ===================== RECEIPT =====================
function showReceipt(order, paymentMethod='cash'){
  const lines = order.items.map(it=>`${it.productName} x${it.quantity} — ${IDR(it.subtotal)}`).join('\n');
  const payLabel = paymentMethod === 'cash' ? 'TUNAI' : 'TRANSFER / PENDING';
  const waText = `*Struk Success Vape*\n${new Date(order.createdAt).toLocaleString('id-ID')}\nOrder: ${order.orderId}\nPembayaran: ${payLabel}\n\n${lines}\n\n*Total: ${IDR(order.totalAmount)}*\nStatus: ${order.paymentStatus}`;
  modal(`
    <div class="p-5">
      <div id="receiptContent" class="font-body">
        <div class="text-center mb-3">
          <div class="font-head font-extrabold">Success Vape</div>
          <div class="text-xs text-white/50">${fmtDate(order.createdAt)}</div>
          <div class="text-xs text-white/40">Order: ${order.orderId}</div>
          <div class="text-xs mt-1 ${paymentMethod==='cash'?'text-accent':'text-warn'} font-medium">${payLabel}</div>
        </div>
        <div class="border-t border-dashed border-black/20 my-2"></div>
        <div class="space-y-1 text-sm">
          ${order.items.map(it=>`
            <div class="flex justify-between"><span>${it.productName} x${it.quantity}</span><span class="tabular">${IDR(it.subtotal)}</span></div>
          `).join('')}
        </div>
        <div class="border-t border-dashed border-black/20 my-2"></div>
        <div class="flex justify-between font-head font-bold"><span>Total</span><span class="tabular">${IDR(order.totalAmount)}</span></div>
        ${paymentMethod==='transfer' ? `
        <div class="mt-3 p-3 bg-warn/5 border border-warn/20 rounded-lg text-xs text-warn">
          <b>Menunggu pembayaran transfer.</b> Setelah transfer dikonfirmasi, ubah status order di tab Riwayat Order.
        </div>` : ''}
      </div>
      <div class="grid grid-cols-2 gap-2 mt-5">
        <button id="btnPrint" class="border border-black/10 rounded-lg py-2.5 font-medium text-sm">Cetak</button>
        <a id="btnWa" target="_blank" href="https://wa.me/?text=${encodeURIComponent(waText)}" class="bg-accent text-white rounded-lg py-2.5 font-medium text-sm text-center">WhatsApp</a>
      </div>
      <button id="btnDoneReceipt" class="w-full mt-2 text-sm text-white/50 py-2">Selesai</button>
    </div>
  `);
  document.getElementById('btnPrint').onclick = ()=>{
    document.getElementById('receiptPrintArea').innerHTML = document.getElementById('receiptContent').innerHTML;
    window.print();
  };
  document.getElementById('btnDoneReceipt').onclick = closeModal;
}

// ===================== ORDERS =====================
function renderOrders(){
  const el = document.getElementById('view-orders');
  el.innerHTML = `
    <div class="mb-3">
      <div class="font-head font-bold text-lg">Riwayat Order</div>
      <div class="text-xs text-white/50">${orders.length} order</div>
    </div>
    <div class="space-y-2">
      ${orders.slice(0, 50).map(o=>`
        <div class="card bg-dark-800 rounded-xl p-3 border border-black/5">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="text-sm font-medium">${o.orderId}</div>
              <div class="text-xs text-white/40 mt-0.5">${fmtDate(o.createdAt)} • ${o.items.length} item • ${o.source}</div>
              <div class="text-xs mt-1">
                <span class="inline-block px-2 py-0.5 rounded ${o.orderStatus==='completed'?'bg-accent/10 text-accent':'bg-ink/5 text-ink/60'}">${o.orderStatus}</span>
                <span class="inline-block px-2 py-0.5 rounded ml-1 ${o.paymentStatus==='paid'?'bg-accent/10 text-accent':'bg-warn/10 text-warn'}">${o.paymentStatus}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="font-head font-bold tabular text-sm">${IDR(o.totalAmount)}</div>
              <div class="flex gap-1 mt-1">
                ${o.paymentStatus!=='paid' ? `<button data-confirm="${o.orderId}" class="text-[10px] px-2 py-1 rounded bg-accent text-white">✓ Bayar</button>` : ''}
                ${o.orderStatus!=='cancelled' && o.orderStatus!=='completed' ? `<button data-cancel="${o.orderId}" class="text-[10px] px-2 py-1 rounded bg-danger/10 text-danger">Batal</button>` : ''}
              </div>
            </div>
          </div>
        </div>
      `).join('') || `<div class="text-sm text-white/40 text-center py-10">Belum ada order.</div>`}
    </div>
  `;
  // Confirm payment
  el.querySelectorAll('[data-confirm]').forEach(b => b.onclick = async () => {
    const orderId = b.dataset.confirm;
    if (!confirm('Tandai order ini sudah dibayar?')) return;
    try {
      await apiCall(`/orders/${orderId}`, { method: 'PATCH', body: JSON.stringify({ paymentStatus: 'paid', orderStatus: 'completed' }) });
      await loadOrders();
      toast('Order dikonfirmasi');
      renderOrders();
    } catch(e){ toast('Gagal konfirmasi','error'); }
  });
  // Cancel order
  el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    const orderId = b.dataset.cancel;
    if (!confirm('Batalkan order ini? Stok akan dikembalikan.')) return;
    try {
      await apiCall(`/orders/${orderId}`, { method: 'PATCH', body: JSON.stringify({ orderStatus: 'cancelled' }) });
      await loadOrders();
      await loadProducts();
      toast('Order dibatalkan');
      renderOrders();
    } catch(e){ toast('Gagal membatalkan','error'); }
  });
}

// ===================== CUSTOMERS =====================
function renderCustomers(){
  const el = document.getElementById('view-customers');
  el.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="font-head font-bold text-lg">Pelanggan</div>
      <button id="btnAddCustomer" class="bg-accent text-white text-sm font-medium rounded-lg px-3 py-2">+ Tambah</button>
    </div>
    <div class="space-y-2">
      ${customers.map(c=>`
        <div class="card bg-dark-800 rounded-xl p-3 border border-black/5">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="font-medium text-sm">${c.name}</div>
              <div class="text-xs text-white/40 mt-0.5">${c.phone||'—'} • ${c.email||'—'}</div>
              <div class="text-xs text-white/50 mt-1">Total: ${IDR(c.totalSpent||0)} • ${c.transactionCount||0}x transaksi</div>
            </div>
            <button data-edit="${c._id}" class="text-xs px-2.5 py-1.5 rounded-lg border border-black/10">Edit</button>

function openSelectCustomerModal(){
  modal(`
    <div class="p-5">
      <div class="font-head font-bold text-lg mb-4">Pilih Pelanggan</div>
      <button id="btnGuestCheckout" class="w-full bg-accent text-white rounded-lg py-2.5 text-sm font-medium mb-3">👤 Transaksi Tamu</button>
      <div class="space-y-2">
        ${customers.map(cust => `
          <button data-cust="${cust._id}" class="w-full text-left card rounded-xl p-3 border border-black/5 hover:border-accent">
            <div class="text-sm font-medium">${cust.name}</div>
            <div class="text-xs text-white/40">${cust.phone||'—'}</div>
          </button>
        `).join('')}
      </div>
    </div>
  `);
  document.getElementById('btnGuestCheckout').onclick = ()=>{ selectedCustomer = null; closeModal(); renderKasir(); };
  document.querySelectorAll('[data-cust]').forEach(b => b.onclick = ()=>{ selectedCustomer = b.dataset.cust; closeModal(); renderKasir(); });
}

function openCustomerModal(customerId){
  const cust = customerId ? customers.find(c=>c._id===customerId) : { name: '', phone: '', email: '' };
  modal(`
    <div class="p-5">
      <div class="font-head font-bold text-lg mb-4">${customerId ? 'Edit Pelanggan' : 'Tambah Pelanggan'}</div>
      <div class="space-y-3">
        <div>
          <label class="text-sm font-medium">Nama</label>
          <input id="cf_name" type="text" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${cust.name||''}">
        </div>
        <div>
          <label class="text-sm font-medium">Telepon</label>
          <input id="cf_phone" type="text" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${cust.phone||''}">
        </div>
        <div>
          <label class="text-sm font-medium">Email</label>
          <input id="cf_email" type="email" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${cust.email||''}">
        </div>
      </div>
      <div class="flex gap-2 mt-5">
        <div class="flex-1"></div>
        <button id="btnCancelCust" class="px-4 py-2.5 text-sm">Batal</button>
        <button id="btnSaveCust" class="bg-accent text-white rounded-lg px-4 py-2.5 text-sm font-medium">Simpan</button>
      </div>
    </div>
  `);
  document.getElementById('btnCancelCust').onclick = closeModal;
  document.getElementById('btnSaveCust').onclick = async () => {
    const name = document.getElementById('cf_name').value.trim();
    if (!name) { toast('Nama wajib','error'); return; }
    const custData = {
      name,
      phone: document.getElementById('cf_phone').value.trim(),
      email: document.getElementById('cf_email').value.trim()
    };
    try {
      if (customerId){
        await apiCall(`/customers/${customerId}`, { method: 'PATCH', body: JSON.stringify(custData) });
      } else {
        await apiCall('/customers', { method: 'POST', body: JSON.stringify(custData) });
      }
      await loadCustomers();
      closeModal();
      toast('Customer disimpan');
      render();
    } catch(e){ toast('Gagal menyimpan','error'); }
  };
}

// ===================== PRODUCTS =====================
function renderProducts(){
  const el = document.getElementById('view-products');
  const items = Object.values(products);
  el.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="font-head font-bold text-lg">Kelola Produk</div>
      <button id="btnAddProduct" class="bg-accent text-white text-sm font-medium rounded-lg px-3 py-2">+ Tambah</button>
    </div>
    <div class="space-y-2">
      ${items.map(p=>`
        <div class="card bg-dark-800 rounded-xl p-3 border border-black/5">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="font-medium text-sm">${p.name}</div>
              <div class="text-xs text-white/40 mt-0.5">${IDR(p.price)} • Stok ${p.stock||0}</div>
            </div>
            <button data-edit-prod="${p.id}" class="text-xs px-2.5 py-1.5 rounded-lg border border-black/10">Edit</button>

      `).join('') || `<div class="text-sm text-white/40 text-center py-10">Belum ada produk.</div>`}

function openProductModal(productId){
  const prod = productId ? products[productId] : { name: '', price: 0, stock: 0 };
  modal(`
    <div class="p-5">
      <div class="font-head font-bold text-lg mb-4">${productId ? 'Edit Produk' : 'Tambah Produk'}</div>
      <div class="space-y-3">
        <div>
          <label class="text-sm font-medium">Nama</label>
          <input id="pf_name" type="text" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${prod.name||''}">
        </div>
        <div>
          <label class="text-sm font-medium">Harga</label>
          <input id="pf_price" type="number" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${prod.price||0}">
        </div>
        <div>
          <label class="text-sm font-medium">Stok</label>
          <input id="pf_stock" type="number" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${prod.stock||0}">
        </div>
      </div>
      <div class="flex gap-2 mt-5">
        <div class="flex-1"></div>
        <button id="btnCancelProd" class="px-4 py-2.5 text-sm">Batal</button>
        <button id="btnSaveProd" class="bg-accent text-white rounded-lg px-4 py-2.5 text-sm font-medium">Simpan</button>
      </div>
    </div>
  `);
  document.getElementById('btnCancelProd').onclick = closeModal;
  document.getElementById('btnSaveProd').onclick = async () => {
    const name = document.getElementById('pf_name').value.trim();
    if (!name) { toast('Nama wajib','error'); return; }
    const prodData = {
      name,
      price: parseInt(document.getElementById('pf_price').value) || 0,
      stock: parseInt(document.getElementById('pf_stock').value) || 0
    };
    try {
      if (productId){
        await apiCall(`/products/${productId}`, { method: 'PATCH', body: JSON.stringify(prodData) });
      } else {
        await apiCall('/products', { method: 'POST', body: JSON.stringify(prodData) });
      }
      await loadProducts();
      closeModal();
      toast('Produk disimpan');
      render();
    } catch(e){ toast('Gagal menyimpan','error'); }
  };
}

// ===================== AUTO-LOGIN =====================
(async ()=>{
  const token = getToken();
  const storedUser = localStorage.getItem('currentUser');
  if (token && storedUser){
    authToken = token;
    currentUser = JSON.parse(storedUser);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    try {
      await loadCustomers();
      await loadOrders();
      await loadProducts();
      render();
    } catch(e) {
      clearToken();
      location.reload();
    }
  }
})();
</script>
