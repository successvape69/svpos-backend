<body class="font-body text-white selection:bg-accent/30 overflow-hidden">

      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="kasir" title="Kasir">🛒</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="products" title="Produk">📦</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="opname" title="Opname">📋</button>
      <button class="tabbtn w-12 h-12 flex items-center justify-center navbtn text-white/40 hover:text-white" data-tab="reports" title="Laporan">📈</button>

  <div class="flex-1 flex flex-col min-w-0 bg-dark-900">

          </div>

            <input id="loginPassword" type="password" placeholder="Password" class="w-full bg-dark-800 border border-white/5 rounded-xl px-4 py-3.5 text-sm focus:border-accent outline-none transition-all" value="admin123">
          </div>
          <button type="submit" class="w-full bg-accent text-black font-bold rounded-xl py-3.5 text-sm shadow-lg shadow-accent/20 active:scale-[0.98] transition-transform">Sign In</button>

    <!-- Main Content Wrapper -->

        <div class="flex items-center gap-3">

          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
        </div>
        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <div id="currentUser" class="font-bold text-sm">Admin</div>
            <div class="text-[10px] text-white/40 tracking-widest uppercase">Verified</div>
          </div>
          <div class="w-10 h-10 rounded-full bg-dark-800 border border-white/10 flex items-center justify-center text-xs">A</div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
        <section id="view-dashboard" class="hidden"></section>
        <section id="view-kasir" class="hidden h-full"></section>
        <section id="view-products" class="hidden"></section>
        <section id="view-opname" class="hidden"></section>
        <section id="view-reports" class="hidden"></section>
        <section id="view-finance" class="hidden"></section>

<div id="modalRoot"></div>
<div id="receiptPrintArea" class="hidden font-body text-black"></div>

<script>
const API_BASE = '/api';

const IDR = n => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(Math.round(n||0));
const fmtDate = ts => new Date(ts).toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'});
const uid = () => Math.random().toString(36).slice(2,10);

function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-2 rounded-full text-sm font-medium shadow-lg ' +
    (kind==='error' ? 'bg-danger text-white' : 'bg-ink text-white');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 1800);
}

function modal(innerHtml, {wide=false} = {}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" id="modalOverlay">
      <div class="card bg-dark-900 border border-white/10 w-full ${wide ? 'sm:max-w-xl':'sm:max-w-md'} rounded-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
        ${innerHtml}
      </div>
    </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

let currentUser = null;
let authToken = null;
let customers = [];
let orders = [];
let selectedCustomer = null;
let cart = {};
let checkoutDiscount = 0;
let activeTab = 'dashboard';

let products = {};

// --- Auth helpers ---
function getToken(){ return localStorage.getItem('authToken'); }
function setToken(t){ localStorage.setItem('authToken', t); }
function clearToken(){ localStorage.removeItem('authToken'); localStorage.removeItem('currentUser'); }

// --- API call with JWT ---
async function apiCall(endpoint, options = {}){
  const token = authToken || getToken();
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;

  try {
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (res.status === 401) {
      clearToken(); currentUser = null; authToken = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('hidden');
      toast('Sesi expired, login ulang','error');
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return await res.json();
  } catch(e){
    console.error('API error:', e);
    toast(e.message || 'Koneksi API gagal','error');
    throw e;
  }
}

async function loadCustomers(){
  try { customers = await apiCall('/customers'); } catch(e){ customers = []; }
}
async function loadOrders(){
  try { orders = await apiCall('/orders'); } catch(e){ orders = []; }
}
async function loadProducts(){
  try {
    const data = await apiCall('/products');
    products = {};
    data.forEach(p => { products[p._id] = { id: p._id, name: p.name, price: p.price, purchasePrice: p.purchasePrice || 0, stock: p.stock }; });
  } catch(e){ /* fallback empty */ }
}

// --- Login ---
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');

    authToken = data.token;
    currentUser = data.user;
    setToken(data.token);
    localStorage.setItem('currentUser', JSON.stringify(data.user));

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    await loadCustomers();
    await loadOrders();
    await loadProducts();
    render();
    toast('Login berhasil');
  } catch(err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
};

// --- Logout ---
document.getElementById('btnLogout').onclick = () => {
  currentUser = null; authToken = null;
  clearToken();
  location.reload();
};

// --- Tabs ---
document.querySelectorAll('.tabbtn').forEach(b => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(x => {
      x.classList.remove('text-accent','border-accent');
      x.classList.add('text-white/50','border-transparent');
    });
    b.classList.add('text-accent','border-accent');
    b.classList.remove('text-white/50','border-transparent');
    render();
  };
});

function render(){
  if (!currentUser) return;
  document.getElementById('currentUser').textContent = currentUser.username + ' (' + (currentUser.role||'kasir') + ')';
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('sidebar').classList.add('flex');

  const isAdmin = currentUser.role === 'admin';

  // Sembunyiin tab admin-only untuk kasir
  document.querySelectorAll('.tabbtn').forEach(btn => {
    const adminOnly = ['opname','reports','users'].includes(btn.dataset.tab);
    btn.classList.toggle('hidden', adminOnly && !isAdmin);
  });

  // Update view title
  const tabNames = { dashboard:'Dashboard', kasir:'Kasir', products:'Produk', opname:'Stock Opname', reports:'Laporan', users:'Users', orders:'Order', customers:'Pelanggan' };
  document.getElementById('viewTitle').textContent = tabNames[activeTab] || activeTab;

  // Jika aktif di tab yang disembunyikan, fallback ke dashboard
  if (!isAdmin && ['opname','reports','users'].includes(activeTab)) activeTab = 'dashboard';

  if (activeTab !== 'kasir'){ const old=document.getElementById('cartBar'); if(old) old.remove(); }
  document.querySelectorAll('main section').forEach(s=> s.classList.add('hidden'));

  const views = {
    dashboard: 'view-dashboard', kasir: 'view-kasir', products: 'view-products',
    opname: 'view-opname', reports: 'view-reports', finance: 'view-finance', users: 'view-users',
    orders: 'view-orders', customers: 'view-customers'
  };
  if (views[activeTab]) document.getElementById(views[activeTab]).classList.remove('hidden');

  if (activeTab === 'dashboard') renderDashboard();
  else if (activeTab === 'kasir') renderKasir();
  else if (activeTab === 'products') renderProducts();
  else if (activeTab === 'opname') renderOpname();
  else if (activeTab === 'reports') renderReports();
  else if (activeTab === 'finance') renderFinance();
  else if (activeTab === 'users') renderUsers();
  else if (activeTab === 'orders') renderOrders();
  else if (activeTab === 'customers') renderCustomers();
}

// ===================== DASHBOARD =====================
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const paidOrders = orders.filter(o => o.paymentStatus==='paid');
  const todayOrders = paidOrders.filter(o => isToday(o.createdAt));
  const pendingOrders = orders.filter(o => o.paymentStatus==='pending' && o.orderStatus!=='cancelled');
  const todayOmzet = todayOrders.reduce((s,o)=>s+(o.totalAmount||0),0);
  const allOmzet = paidOrders.reduce((s,o)=>s+(o.totalAmount||0),0);
  const totalStok = Object.values(products).reduce((s,p)=>s+(p.stock||0),0);
  const totalSku = Object.values(products).length;

  const qtyByProd = {};
  paidOrders.forEach(o => (o.items||[]).forEach(it => { qtyByProd[it.productName] = (qtyByProd[it.productName]||0) + (it.quantity||0); }));
  const topProducts = Object.entries(qtyByProd).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lowStock = Object.values(products).filter(p => (p.stock||0) <= 5).sort((a,b)=>a.stock-b.stock);

  const days = [];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const next=new Date(d); next.setDate(d.getDate()+1);
    const dayOmzet = paidOrders.filter(o=>{ const t=new Date(o.createdAt); return t>=d && t<next; }).reduce((s,o)=>s+(o.totalAmount||0),0);
    days.push({label:d.toLocaleDateString('id-ID',{weekday:'short'}), val:dayOmzet});
  }
  const maxDayVal = Math.max(1, ...days.map(d=>d.val));

  el.innerHTML = `
    <!-- Top Hero Metric Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>OMZET HARI INI</span>
          <span class="text-accent text-sm">📈</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${IDR(todayOmzet)}</div>
        <div class="text-xs text-accent/80 font-medium">${todayOrders.length} transaksi selesai</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>TOTAL PENDAPATAN</span>
          <span class="text-accent text-sm">💎</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${IDR(allOmzet)}</div>
        <div class="text-xs text-white/40 font-medium">${paidOrders.length} total pesanan</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>PERLU DIKONFIRMASI</span>
          <span class="text-warn text-sm">⏳</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-warn mb-1 tabular">${pendingOrders.length}</div>
        <div class="text-xs text-white/40 font-medium">Menunggu pembayaran/transfer</div>
      </div>

      <div class="card bg-gradient-to-br from-dark-800 to-dark-900 rounded-2xl p-5 border-white/5">
        <div class="flex items-center justify-between text-white/40 text-xs font-medium mb-3">
          <span>TOTAL STOK FISIK</span>
          <span class="text-white/40 text-sm">📦</span>
        </div>
        <div class="font-head font-extrabold text-2xl tracking-tight text-white mb-1 tabular">${totalStok}</div>
        <div class="text-xs text-white/40 font-medium">${totalSku} varian produk terdaftar</div>
      </div>
    </div>

    <!-- Revenue Graph -->
    <div class="card rounded-2xl p-5 border-white/5 mb-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-sm font-bold">Tren Penjualan</div>
          <div class="text-xs text-white/40">Grafik 7 hari terakhir</div>
        </div>
      </div>
      <div class="flex items-end gap-3 h-36 pt-4 border-t border-white/5">
        ${days.map(d=>`
          <div class="flex-1 flex flex-col items-center gap-2 group">
            <div class="w-full bg-dark-800 group-hover:bg-accent/20 rounded-xl h-full flex items-end p-1 transition-colors">
              <div class="w-full bg-accent rounded-lg transition-all duration-500 shadow-lg shadow-accent/20" style="height:${Math.round((d.val/maxDayVal)*100)}%" title="${IDR(d.val)}"></div>
            </div>
            <span class="text-[11px] text-white/40 font-medium">${d.label}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Split Panels: Best Sellers & Low Stock -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card rounded-2xl p-5 border-white/5">
        <div class="text-sm font-bold mb-4">Produk Paling Laris</div>
        <div class="space-y-3">
          ${topProducts.length ? topProducts.map(([name,qty],i)=>`
            <div class="flex items-center justify-between p-3 bg-dark-800 rounded-xl border border-white/5">
              <div class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-accent/10 text-accent font-bold text-xs flex items-center justify-center">${i+1}</span>
                <span class="text-sm font-medium">${name}</span>
              </div>
              <span class="text-xs font-bold text-accent tabular">${qty} Terjual</span>
            </div>
          `).join('') : `<div class="text-sm text-white/30 py-8 text-center">Belum ada transaksi.</div>`}
        </div>
      </div>

      <div class="card rounded-2xl p-5 border-white/5">
        <div class="text-sm font-bold mb-4">Peringatan Stok Tipis (≤ 5)</div>
        <div class="space-y-3">
          ${lowStock.length ? lowStock.map(p=>`
            <div class="flex items-center justify-between p-3 bg-dark-800 rounded-xl border border-white/5">
              <span class="text-sm font-medium">${p.name}</span>
              <span class="text-xs px-2.5 py-1 rounded-lg ${p.stock<=0?'bg-danger/20 text-danger':'bg-warn/20 text-warn'} font-bold tabular">Sisa ${p.stock}</span>
            </div>
          `).join('') : `<div class="text-sm text-accent py-8 text-center font-medium">✓ Semua stok tercukupi dengan baik</div>`}
        </div>
      </div>
    </div>
  `;
}

// ===================== KASIR =====================
function renderKasir(){
  const el = document.getElementById('view-kasir');
  const items = Object.values(products);
  const cartItems = Object.entries(cart).filter(([id,qty])=>qty>0);
  const total = cartItems.reduce((s,[id,qty])=> s + (products[id]?.price||0)*qty, 0);

  // Remove old floating cart if any
  const old = document.getElementById('cartBar'); if (old) old.remove();

  el.innerHTML = `
    <div class="h-full flex flex-col lg:flex-row gap-6">
      <!-- Left: Products Grid -->
      <div class="flex-1 flex flex-col min-h-0">
        <div class="mb-4 flex gap-3">
          <input id="kasirSearch" type="text" placeholder="Cari nama produk…" class="flex-1 bg-dark-800 border border-white/5 rounded-xl px-4 py-3 text-sm focus:border-accent outline-none">
          <button id="btnSelectCustomer" class="bg-dark-800 border border-white/5 hover:border-accent text-sm font-medium rounded-xl px-4 py-3 transition-colors">👤 ${selectedCustomer ? customers.find(c=>c._id===selectedCustomer)?.name : 'Tamu'}</button>
        </div>
        <div id="kasirGrid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 content-start pr-2"></div>
      </div>

      <!-- Right: Permanent Cart Panel -->
      <div class="w-full lg:w-96 card rounded-2xl flex flex-col h-auto lg:h-full border border-white/5 p-4 shadow-2xl">
        <div class="text-sm font-bold pb-3 border-b border-white/5 flex items-center justify-between">
          <span>Current Order</span>
          <span class="text-xs text-white/40">${cartItems.reduce((s,[,q])=>s+q,0)} items</span>
        </div>
        
        <div class="flex-1 overflow-y-auto my-3 space-y-2 pr-1">
          ${cartItems.length ? cartItems.map(([id,qty])=>{
            const p = products[id];
            return `<div class="bg-dark-800 rounded-xl p-3 border border-white/5 flex items-center justify-between text-sm">
              <div class="flex-1 truncate mr-2">
                <div class="font-medium truncate">${p.name}</div>
                <div class="text-xs text-white/40 tabular">${IDR(p.price)}</div>
              </div>
              <div class="flex items-center gap-2">
                <button data-dec="${id}" class="w-7 h-7 rounded-lg bg-dark-700 hover:bg-white/10 flex items-center justify-center text-xs">–</button>
                <span class="w-5 text-center tabular font-bold">${qty}</span>

  const input = document.getElementById('discountInput');
  const preview = document.getElementById('discPreview');
  const clearBtn = document.getElementById('btnClearDisc');

  document.getElementById('btnApplyDisc').onclick = () => {

    if (v < 0) v = 0;

// ===================== CHECKOUT =====================
async function doCheckout(paymentMethod){
  const cartItems = Object.entries(cart).filter(([id,qty])=>qty>0);
  if (!cartItems.length) return;

  const items = cartItems.map(([id,qty])=>{
    const p = products[id];
    return { productId:id, productName:p.name, price:p.price, quantity:qty, subtotal:p.price*qty };
  });

  const orderData = {
    customerId: selectedCustomer,
    items,
    discount: checkoutDiscount || 0,
    source: 'pos'
  };

  try {
    const result = await apiCall('/orders', { method: 'POST', body: JSON.stringify(orderData) });
    const order = result.order;

    // Kalau bayar tunai, langsung set paid + completed
    if (paymentMethod === 'cash') {
      await apiCall(`/orders/${order.orderId}`, {
        method: 'PATCH',
        body: JSON.stringify({ paymentStatus: 'paid', orderStatus: 'completed' })
      });
      order.paymentStatus = 'paid';
      order.orderStatus = 'completed';
    }

    const discLabel = checkoutDiscount ? ` diskon ${checkoutDiscount}%` : '';
    toast(paymentMethod === 'cash' ? 'Pembayaran tunai' + discLabel + ' berhasil' : 'Order dibuat, tunggu transfer' + discLabel);
    cart = {};
    selectedCustomer = null;
    checkoutDiscount = 0;
    await loadOrders();
    await loadProducts();
    closeModal();
    showReceipt(order, paymentMethod);
    render();
  } catch(e){
    toast('Gagal membuat order','error');
  }
}

// ===================== RECEIPT =====================
function showReceipt(order, paymentMethod='cash'){
  const discInfo = (order.discount ? ` (diskon ${order.discount}%)` : '');
  const origLine = order.discount ? `Subtotal: ${IDR(order.originalTotal)}\nDiskon ${order.discount}%: - ${IDR((order.originalTotal||order.totalAmount) - order.totalAmount)}\n` : '';
  const lines = order.items.map(it=>`${it.productName} x${it.quantity} — ${IDR(it.subtotal)}`).join('\n');
  const payLabel = paymentMethod === 'cash' ? 'TUNAI' : 'TRANSFER / PENDING';
  const waText = `*Struk Success Vape*\n${new Date(order.createdAt).toLocaleString('id-ID')}\nOrder: ${order.orderId}\nPembayaran: ${payLabel}${discInfo}\n\n${lines}\n\n${origLine}*Total: ${IDR(order.totalAmount)}*\nStatus: ${order.paymentStatus}`;
  modal(`
    <div class="p-5">
      <div id="receiptContent" class="font-body">
        <div class="text-center mb-3">
          <div class="font-head font-extrabold">Success Vape</div>
          <div class="text-xs text-white/50">${fmtDate(order.createdAt)}</div>
          <div class="text-xs text-white/40">Order: ${order.orderId}</div>
          <div class="text-xs mt-1 ${paymentMethod==='cash'?'text-accent':'text-warn'} font-medium">${payLabel}${discInfo}</div>
        </div>
        <div class="border-t border-dashed border-white/10 my-2"></div>
        <div class="space-y-1 text-sm">
          ${order.items.map(it=>`
            <div class="flex justify-between"><span>${it.productName} x${it.quantity}</span><span class="tabular">${IDR(it.subtotal)}</span></div>
          `).join('')}
        </div>
        <div class="border-t border-dashed border-white/10 my-2"></div>
        ${order.discount ? `
          <div class="space-y-1 text-xs mb-2">
            <div class="flex justify-between text-white/40"><span>Subtotal</span><span class="tabular">${IDR(order.originalTotal)}</span></div>
            <div class="flex justify-between text-accent"><span>Diskon ${order.discount}%</span><span class="tabular">- ${IDR((order.originalTotal||order.totalAmount) - order.totalAmount)}</span></div>
          </div>` : ''}
        <div class="flex justify-between font-head font-bold"><span>Total</span><span class="tabular">${IDR(order.totalAmount)}</span></div>
        ${paymentMethod==='transfer' ? `
        <div class="mt-3 p-3 bg-warn/5 border border-warn/20 rounded-lg text-xs text-warn">
          <b>Menunggu pembayaran transfer.</b> Setelah transfer dikonfirmasi, ubah status order di tab Riwayat Order.
        </div>` : ''}
      </div>
      <div class="grid grid-cols-3 gap-2 mt-5">
        <button id="btnPrint" class="border border-white/10 rounded-lg py-2.5 font-medium text-sm text-white/80">Printer</button>
        <button id="btnPrintBT" class="border border-white/10 rounded-lg py-2.5 font-medium text-sm text-white/80 bg-dark-700">Bluetooth</button>
        <a id="btnWa" target="_blank" href="https://wa.me/?text=${encodeURIComponent(waText)}" class="bg-accent text-black rounded-lg py-2.5 font-medium text-sm text-center">WhatsApp</a>
      </div>
      <button id="btnDoneReceipt" class="w-full mt-2 text-sm text-white/50 py-2">Selesai</button>
    </div>
  `);
  document.getElementById('btnPrint').onclick = ()=>{
    document.getElementById('receiptPrintArea').innerHTML = document.getElementById('receiptContent').innerHTML;
    window.print();
  };

}

    try {
      await apiCall(`/orders/${orderId}`, { method: 'PATCH', body: JSON.stringify({ paymentStatus: 'paid', orderStatus: 'completed' }) });
      await loadOrders();
      toast('Order dikonfirmasi');
      renderOrders();

  // Cancel order
  el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {

      await loadProducts();
      toast('Order dibatalkan');

  // Return order (refund + stok kembali)

    try {
      const r = await apiCall(`/orders/${orderId}/return`, { method: 'POST', body: JSON.stringify({ reason }) });
      await loadOrders();
      await loadProducts();
      toast(`Retur OK, refund ${IDR(r.refundAmount || 0)}`);
      renderOrders();
    } catch(e){ toast(e.message || 'Gagal retur','error'); }
  });
}

    } catch(e) { toast('Gagal simpan opname','error'); }
  };

  document.getElementById('csvUpload').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const text = event.target.result;
      const lines = text.split('\n');
      // Format CSV: Nama Produk, Stok Fisik
      lines.forEach(line => {
        const [name, stock] = line.split(',');
        if (!name || isNaN(parseInt(stock))) return;
        const p = items.find(x => x.name.toLowerCase() === name.trim().toLowerCase());
        if (p) opnameData[p.id] = parseInt(stock);
      });
      renderOpname();
      toast('CSV diimpor (hanya produk yang cocok)');
    };
    reader.readAsText(file);
  };
}

// ===================== BLUETOOTH THERMAL PRINTER (ESC/POS) =====================
let btDevice = null;
let btCharacteristic = null;

async function connectBluetooth() {
  if (!navigator.bluetooth) {
    toast('Web Bluetooth tidak didukung di browser ini','error');
    return false;
  }
  try {
    toast('Mencari printer Bluetooth...');
    btDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['battery_service'] // Beberapa printer butuh service ID spesifik
    });
    const server = await btDevice.gatt.connect();
    const service = await server.getPrimaryService('battery_service').catch(() => null); 
    // Fallback: langsung cari characteristic nulis
    if (service) {
      btCharacteristic = await service.getCharacteristic('battery_level');
    } else {
      // Coba service serial port atau generic
      const services = await server.getPrimaryServices();
      if (services.length > 0) {
        const chars = await services[0].getCharacteristics();
        btCharacteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      }
    }
    
    if (btCharacteristic) {
      toast(`Terhubung ke ${btDevice.name || 'Printer'}!`, 'ok');
      return true;
    } else {
      toast('Gagal menemukan service tulis di printer','error');
      return false;
    }
  } catch (err) {
    console.error(err);
    toast('Gagal koneksi Bluetooth: ' + err.message, 'error');
    return false;
  }
}

function alignCenter() { return new Uint8Array([0x1B, 0x61, 1]); }
function alignLeft() { return new Uint8Array([0x1B, 0x61, 0]); }
function boldOn() { return new Uint8Array([0x1B, 0x45, 0x01]); }
function boldOff() { return new Uint8Array([0x1B, 0x45, 0x00]); }
function cutPaper() { return new Uint8Array([0x1D, 0x56, 0x41, 0x10]); } // GS V A 16

function encode(str) {
  return new TextEncoder().encode(str);
}

async function thermalPrint(order, payMethod) {
  if (!btCharacteristic) {
    const connected = await connectBluetooth();
    if (!connected) return;
  }

  const center = alignCenter();
  const left = alignLeft();
  const bold = boldOn();
  const unbold = boldOff();
  const lines = [];

  // Struk sederhana
  lines.push(center, bold, encode("SUCCESS VAPE\n"), unbold);
  lines.push(center, encode("================================\n"));
  lines.push(left, encode(`ID: ${order.orderId}\n`));
  lines.push(left, encode(`Tgl: ${fmtDate(order.createdAt)}\n`));
  lines.push(center, encode("================================\n"));
  lines.push(left, encode("Item           Qty   Subtotal\n"));
  lines.push(left, encode("--------------------------------\n"));
  
  order.items.forEach(it => {
    const name = it.productName.substring(0, 15).padEnd(15);
    const qty = String(it.quantity).padStart(3);
    const sub = IDR(it.subtotal).padStart(10);
    lines.push(left, encode(`${name} ${qty} ${sub}\n`));
  });

  lines.push(center, encode("================================\n"));
  lines.push(bold, encode(`TOTAL: ${IDR(order.totalAmount).padStart(25)}\n`), unbold);
  lines.push(left, encode(`Bayar: ${payMethod.toUpperCase()}\n`));
  lines.push(center, encode("\nTERIMA KASIH\n"));
  lines.push(cutPaper());

  try {
    for (const line of lines) {
      await btCharacteristic.writeValue(line);
    }
    toast('Berhasil kirim ke printer!');
  } catch (err) {
    toast('Gagal mencetak: ' + err.message, 'error');
    btCharacteristic = null; // Reset biar reconnect
  }
}

    };
    try {
      if (productId){
        await apiCall(`/products/${productId}`, { method: 'PATCH', body: JSON.stringify(prodData) });
      } else {
        await apiCall('/products', { method: 'POST', body: JSON.stringify(prodData) });
      }
      await loadProducts();
      closeModal();
      toast('Produk disimpan');
      render();
    } catch(e){ toast('Gagal menyimpan','error'); }
  };
}

// ===================== AUTO-LOGIN =====================
(async ()=>{
  const token = getToken();
  const storedUser = localStorage.getItem('currentUser');
  if (token && storedUser){
    authToken = token;
    currentUser = JSON.parse(storedUser);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    try {
      await loadCustomers();
      await loadOrders();
      await loadProducts();
      render();
    } catch(e) {
      clearToken();
      location.reload();
    }
  }
})();
</script>
</body>
