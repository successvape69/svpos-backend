<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Success Vape — Toko Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { head: ['Manrope','sans-serif'], body: ['Inter','sans-serif'] },
      colors: { dark: { 900:'#0A0A0A', 800:'#141414', 700:'#1F1F1F', 600:'#2E2E2E' }, accent: { DEFAULT:'#10B981', soft:'#064E3B' }, warn:'#F59E0B', danger:'#EF4444' }
    }}
  }
</script>
<style>
  body { background: #0A0A0A; color: #FFF; font-family: 'Inter', sans-serif; }
  .card { background: #141414; border: 1px solid rgba(255,255,255,0.05); }
  .tabular { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { height:4px; width:4px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:99px; }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-white/5 bg-dark-900/80 backdrop-blur-md sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
    <a href="/shop/" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center font-head font-extrabold text-black">⚡</div>
      <div>
        <div class="font-head font-bold text-lg">Success Vape Store</div>
        <div class="text-[10px] text-white/40 uppercase tracking-widest">Online Catalog</div>
      </div>
    </a>
    <div class="flex items-center gap-2">
      <button id="btnMyAccount" class="bg-dark-800 border border-white/10 rounded-xl px-4 py-2.5 text-xs font-bold flex items-center gap-2 hover:border-accent transition-colors">⭐ Poin & Pesanan</button>
      <button id="btnCartToggle" class="relative bg-dark-800 border border-white/10 rounded-xl px-4 py-2.5 text-xs font-bold flex items-center gap-2 hover:border-accent transition-colors">
        🛒 Keranjang <span id="cartBadge" class="w-5 h-5 bg-accent text-black rounded-full flex items-center justify-center text-[10px] tabular hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Page Views -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-6">
    <!-- KATALOG VIEW -->
    <div id="viewCatalog">
      <div class="mb-6">
        <input id="shopSearch" type="text" placeholder="Cari produk vape kesukaanmu..." class="w-full bg-dark-800 border border-white/10 rounded-2xl px-4 py-3.5 text-sm outline-none focus:border-accent">
      </div>
      <div id="shopGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="col-span-full text-center text-white/40 py-20">Memuat produk...</div>
      </div>
    </div>

    <!-- PORTAL PELANGGAN VIEW -->
    <div id="viewPortal" class="hidden">
      <button id="btnBackToShop" class="text-xs text-white/40 hover:text-accent mb-4 flex items-center gap-1">← Kembali ke Toko</button>
      
      <!-- Step 1: Masukkan No HP -->
      <div id="portalLogin" class="max-w-md mx-auto text-center py-10">
        <div class="text-4xl mb-4">⭐</div>
        <div class="font-head font-bold text-xl mb-2">Cek Poin & Status Pesanan</div>
        <div class="text-xs text-white/40 mb-6">Masukkan nomor WhatsApp yang dipakai saat order</div>
        <div class="flex gap-2">
          <input id="portalPhone" type="tel" placeholder="08xxxxxxxxxx" class="flex-1 bg-dark-800 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-accent tabular">
          <button id="btnPortalCek" class="bg-accent text-black font-bold rounded-xl px-6 py-3 text-sm">Cek</button>
        </div>
        <div id="portalError" class="text-xs text-danger mt-3 hidden"></div>
      </div>

      <!-- Step 2: Hasil Portal -->
      <div id="portalResult" class="hidden"></div>
    </div>
  </main>

  <!-- Modal Root -->
  <div id="modalRoot"></div>

<script>
const API_BASE = '/api';
const IDR = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Math.round(n||0));
const fmtDate = ts => new Date(ts).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
function toast(msg,kind='ok'){
  const el=document.createElement('div');
  el.className='fixed left-1/2 -translate-x-1/2 bottom-10 z-50 px-4 py-2 rounded-full text-sm font-medium shadow-lg '+(kind==='error'?'bg-danger text-white':'bg-accent text-black font-bold');
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},1800);
}

let products={};
let cart={};

async function loadProducts(){
  try{
    const res=await fetch(`${API_BASE}/products`);
    const data=await res.json();
    products={};
    data.forEach(p=>{ products[p._id]={id:p._id,name:p.name,price:p.price,stock:p.stock}; });
    renderCatalog();
  }catch(e){
    document.getElementById('shopGrid').innerHTML='<div class="col-span-full text-center text-danger py-20">Gagal memuat produk.</div>';
  }
}

function renderCatalog(filter=''){
  const grid=document.getElementById('shopGrid');
  const f=filter.toLowerCase();
  const list=Object.values(products).filter(p=>!f||p.name.toLowerCase().includes(f));
  grid.innerHTML=list.map(p=>`
    <div class="card rounded-2xl p-4 flex flex-col justify-between hover:border-accent/30 transition-all ${p.stock<=0?'opacity-40':''}">
      <div>
        <div class="font-head font-bold text-sm line-clamp-2 mb-1">${p.name}</div>
        <div class="text-[11px] text-white/40">Stok: ${p.stock>0?p.stock:'Habis'}</div>
      </div>
      <div class="mt-4 flex items-center justify-between">
        <span class="font-head font-extrabold text-accent text-sm tabular">${IDR(p.price)}</span>
        <button data-buy="${p.id}" class="bg-accent text-black font-bold text-xs rounded-xl px-3 py-2 hover:scale-105 transition-transform ${p.stock<=0?'pointer-events-none opacity-50':''}">+ Beli</button>
      </div>
    </div>
  `).join('')||'<div class="col-span-full text-center text-white/40 py-20">Produk tidak ditemukan.</div>';

  grid.querySelectorAll('[data-buy]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.buy;
      const prod=products[id];
      if((prod.stock||0)<=(cart[id]||0)){toast('Stok tidak cukup','error');return;}
      cart[id]=(cart[id]||0)+1;
      updateCartBadge();
      toast(prod.name+' ditambahkan');
    };
  });
}

function updateCartBadge(){
  const totalQty=Object.values(cart).reduce((a,b)=>a+b,0);
  const badge=document.getElementById('cartBadge');
  if(totalQty>0){badge.textContent=totalQty;badge.classList.remove('hidden');}else{badge.classList.add('hidden');}
}

document.getElementById('shopSearch').oninput=(e)=>renderCatalog(e.target.value);
document.getElementById('btnCartToggle').onclick=openCartModal;

// ===================== PORTAL PELANGGAN =====================
document.getElementById('btnMyAccount').onclick=()=>{
  document.getElementById('viewCatalog').classList.add('hidden');
  document.getElementById('viewPortal').classList.remove('hidden');
  document.getElementById('portalLogin').classList.remove('hidden');
  document.getElementById('portalResult').classList.add('hidden');
};
document.getElementById('btnBackToShop').onclick=()=>{
  document.getElementById('viewCatalog').classList.remove('hidden');
  document.getElementById('viewPortal').classList.add('hidden');
};

document.getElementById('btnPortalCek').onclick=async()=>{
  const phone=document.getElementById('portalPhone').value.replace(/[^0-9]/g,'');
  const errEl=document.getElementById('portalError');
  errEl.classList.add('hidden');
  if(!phone||phone.length<8){errEl.textContent='Masukkan nomor HP yang valid';errEl.classList.remove('hidden');return;}

  try{
    const res=await fetch(`${API_BASE}/customers/lookup/${phone}`);
    if(!res.ok){const e=await res.json();throw new Error(e.error||'Tidak ditemukan');}
    const data=await res.json();
    document.getElementById('portalLogin').classList.add('hidden');
    document.getElementById('portalResult').classList.remove('hidden');

    const statusColor=(s)=>s==='paid'?'text-accent':s==='pending'?'text-warn':'text-danger';
    const progressBadge=(p)=>{
      const colors={antri:'bg-warn/20 text-warn',proses:'bg-blue-500/20 text-blue-400',selesai:'bg-purple-500/20 text-purple-400',diambil:'bg-accent/20 text-accent'};
      return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${colors[p]||colors.antri}">${p||'antri'}</span>`;
    };

    document.getElementById('portalResult').innerHTML=`
      <!-- Poin Card -->
      <div class="card bg-gradient-to-br from-warn/20 to-dark-900 rounded-2xl p-6 border border-warn/30 mb-6 text-center max-w-md mx-auto">
        <div class="text-xs text-white/40 uppercase tracking-widest font-bold mb-1">Reward Points</div>
        <div class="font-head font-extrabold text-5xl tabular text-warn mb-2">⭐ ${data.points}</div>
        <div class="text-xs text-white/40">1 poin per Rp 10.000 belanja</div>
        <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-white/10 text-sm">
          <div><div class="text-white/40 text-xs">Total Belanja</div><div class="font-bold tabular">${IDR(data.totalSpent)}</div></div>
          <div><div class="text-white/40 text-xs">Total Transaksi</div><div class="font-bold">${data.transactionCount}x</div></div>
        </div>
      </div>

      <!-- Riwayat Pesanan -->
      <div class="max-w-2xl mx-auto">
        <div class="font-head font-bold text-lg mb-3">Riwayat Pesanan ${data.name}</div>
        <div class="space-y-3">
          ${data.orders.length?data.orders.map(o=>`
            <div class="card bg-dark-800 rounded-xl p-4 border border-white/5">
              <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                  <div class="font-bold text-sm">${o.orderId} ${progressBadge(o.progress)}</div>
                  <div class="text-[10px] text-white/30 mt-0.5">${fmtDate(o.createdAt)} • ${o.source.toUpperCase()}</div>
                </div>
                <div class="text-right">
                  <div class="font-bold text-accent tabular text-sm">${IDR(o.totalAmount)}</div>
                  <div class="text-[10px] ${statusColor(o.paymentStatus)} font-medium">${o.paymentStatus==='paid'?'✅ Lunas':'⏳ Belum Bayar'}</div>
                </div>
              </div>
              <div class="border-t border-white/5 pt-2 space-y-1">
                ${(o.items||[]).map(it=>`
                  <div class="flex justify-between text-xs text-white/50">
                    <span>${it.name} x${it.qty}</span>
                    <span class="tabular">${IDR(it.price*it.qty)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join(''):'<div class="text-sm text-white/40 text-center py-10">Belum ada pesanan.</div>'}
        </div>
      </div>
    `;
  }catch(e){
    errEl.textContent=e.message||'Gagal mencari data';errEl.classList.remove('hidden');
  }
};

// ===================== CART MODAL =====================
function openCartModal(){
  const cartItems=Object.entries(cart).filter(([id,qty])=>qty>0);
  const subtotal=cartItems.reduce((s,[id,qty])=>s+(products[id]?.price||0)*qty,0);

  const root=document.getElementById('modalRoot');
  root.innerHTML=`
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" id="modalOverlay">
      <div class="card bg-dark-900 border border-white/10 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
          <div class="font-head font-bold text-lg">Keranjang</div>
          <button id="btnCloseCart" class="text-white/40 hover:text-white text-lg">✕</button>
        </div>
        <div class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-1">
          ${cartItems.length?cartItems.map(([id,qty])=>{
            const p=products[id];
            return `<div class="bg-dark-800 rounded-xl p-3 flex items-center justify-between text-sm border border-white/5">
              <div><div class="font-medium">${p.name}</div><div class="text-xs text-white/40">${IDR(p.price)} × ${qty}</div></div>
              <div class="font-bold text-accent tabular">${IDR(p.price*qty)}</div>
            </div>`;
          }).join(''):'<div class="text-sm text-white/40 text-center py-10">Keranjang kosong</div>'}
        </div>
        ${cartItems.length?`
          <div class="space-y-3 pt-3 border-t border-white/5 mb-5">
            <div><label class="text-xs text-white/50">Nama Pemesan</label><input id="custName" type="text" placeholder="Nama kamu" class="w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2.5 mt-1 text-sm outline-none focus:border-accent"></div>
            <div><label class="text-xs text-white/50">No WhatsApp</label><input id="custPhone" type="tel" placeholder="08xxxxxxxxxx" class="w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2.5 mt-1 text-sm outline-none focus:border-accent tabular"></div>
            <div class="flex justify-between items-center text-sm pt-2">
              <span class="text-white/50">Total</span>
              <span class="font-head font-extrabold text-xl text-accent tabular">${IDR(subtotal)}</span>
            </div>
          </div>
          <button id="btnCheckoutWeb" class="w-full bg-accent text-black font-bold rounded-xl py-3.5 text-sm shadow-lg shadow-accent/25 active:scale-[0.98] transition-transform">Kirim Pesanan</button>
        `:''}
      </div>
    </div>`;

  document.getElementById('modalOverlay').onclick=(e)=>{if(e.target.id==='modalOverlay')root.innerHTML='';};
  document.getElementById('btnCloseCart').onclick=()=>root.innerHTML='';

  const btn=document.getElementById('btnCheckoutWeb');
  if(btn){
    btn.onclick=async()=>{
      const name=document.getElementById('custName').value.trim();
      const phone=document.getElementById('custPhone').value.trim();
      if(!name||!phone){toast('Nama & No WhatsApp wajib diisi','error');return;}

      // Buat/cari customer
      let customerId=null;
      try{
        const cRes=await fetch(`${API_BASE}/customers`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})});
        const cData=await cRes.json();
        if(cData.customer)customerId=cData.customer._id;
      }catch(e){}

      const items=cartItems.map(([id,qty])=>{
        const p=products[id];
        return {productId:id,productName:p.name,price:p.price,quantity:qty,subtotal:p.price*qty};
      });

      try{
        const res=await fetch(`${API_BASE}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({customerId,items,source:'web',paymentStatus:'pending',orderStatus:'pending',progress:'antri'})});
        const data=await res.json();
        if(!res.ok)throw new Error(data.error||'Checkout gagal');

        cart={};updateCartBadge();root.innerHTML='';
        const orderId=data.order.orderId;
        const waMsg=`Halo Success Vape, saya *${name}* (${phone}) ingin konfirmasi pesanan online:\nOrder ID: *${orderId}*\nTotal: *${IDR(subtotal)}*\nMohon diproses. Terima kasih!`;

        // Tampilkan portal langsung
        document.getElementById('viewCatalog').classList.add('hidden');
        document.getElementById('viewPortal').classList.remove('hidden');
        document.getElementById('portalLogin').classList.add('hidden');
        document.getElementById('portalResult').classList.remove('hidden');
        document.getElementById('portalResult').innerHTML=`
          <div class="max-w-md mx-auto text-center py-8">
            <div class="w-16 h-16 bg-accent/20 text-accent rounded-full flex items-center justify-center text-3xl mx-auto mb-4">✓</div>
            <div class="font-head font-bold text-xl mb-2">Pesanan Berhasil!</div>
            <div class="text-xs text-white/40 mb-4">Order ID: <b class="text-white">${orderId}</b> • Stok sudah terpotong di toko</div>
            <a href="https://wa.me/6281234567890?text=${encodeURIComponent(waMsg)}" target="_blank" class="inline-block bg-accent text-black font-bold rounded-xl px-6 py-3 text-sm shadow-lg shadow-accent/25 mb-3">Konfirmasi via WhatsApp</a>
            <div class="mt-4 p-4 bg-dark-800 rounded-xl border border-white/5">
              <div class="text-xs text-white/40 mb-2">Cek status pesanan kapan saja:</div>
              <div class="text-sm font-bold">${phone}</div>
            </div>
          </div>`;
        loadProducts();
      }catch(e){toast(e.message||'Gagal checkout','error');}
    };
  }
}

loadProducts();
</script>
</body>
</html>
